<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GORIの筋トレ部屋 - 超脚痩せ7DAYSバーニング</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap');
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #0d0604;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .font-heavy { font-family: 'Black Ops One', cursive; }
    #fire-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }
    .flame-border {
      border: 1px solid rgba(255, 69, 0, 0.4);
      box-shadow: 0 0 15px rgba(255, 69, 0, 0.2), inset 0 0 15px rgba(255, 69, 0, 0.1);
    }
    .flame-glow {
      box-shadow: 0 0 25px rgba(255, 77, 0, 0.45);
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen relative pb-28 select-none">

  <!-- 背景 火の粉パーティクル -->
  <canvas id="fire-canvas"></canvas>

  <div class="relative z-10 max-w-md mx-auto px-4 pt-5">
    
    <!-- ヘッダー -->
    <header class="text-center mb-4">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gradient-to-r from-red-950 via-orange-900 to-black border border-orange-600/50 mb-2">
        <span class="text-orange-400 text-xs font-black tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-fire text-amber-400 animate-pulse"></i> FEMALE SLIM LEGS LAB
        </span>
      </div>
      <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-300 to-red-500 drop-shadow-[0_2px_10px_rgba(255,100,0,0.6)]">
        GORIの筋トレ部屋 🦍🔥
      </h1>
      <p class="text-xs text-orange-200/70 mt-1 font-bold">前ももを張らせず内もも・裏もも・お尻を燃やし尽くす！</p>
    </header>

    <!-- 曜日タブナビゲーション -->
    <div class="flex gap-1.5 overflow-x-auto hide-scrollbar py-2 px-1 mb-4" id="days-nav"></div>

    <!-- 本日の達成率プログレス -->
    <div class="bg-black/60 backdrop-blur-md rounded-2xl p-4 mb-4 flame-border relative overflow-hidden">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-black text-orange-300 flex items-center gap-1.5">
          <i class="fa-solid fa-bolt text-amber-400"></i> 本日の燃焼度
        </span>
        <span id="burn-percentage" class="text-lg font-black text-amber-300">0%</span>
      </div>
      <div class="w-full bg-neutral-900 rounded-full h-3.5 p-0.5 border border-orange-950 overflow-hidden">
        <div id="burn-bar" class="h-full rounded-full bg-gradient-to-r from-orange-600 via-amber-500 to-yellow-400 transition-all duration-500 ease-out shadow-[0_0_12px_#ff5500]" style="width: 0%;"></div>
      </div>
      <p id="burn-cheer" class="text-[11px] text-neutral-400 mt-2 font-bold text-center">タップして脂肪燃焼タスクを完了せよ！</p>
    </div>

    <!-- ターゲット栄養素セクション -->
    <section class="bg-neutral-950/85 backdrop-blur-md rounded-2xl p-4 mb-4 flame-border">
      <div class="flex items-center justify-between border-b border-orange-900/40 pb-2 mb-3">
        <div class="flex items-center gap-2">
          <span class="p-1.5 rounded-lg bg-orange-600/30 text-amber-400 text-sm">
            <i class="fa-solid fa-utensils"></i>
          </span>
          <div>
            <h2 class="text-sm font-black text-white">今日の燃焼チャージ</h2>
            <p class="text-[10px] text-orange-400 font-bold">朝昼夜の枠なし！この栄養素を狙い撃て</p>
          </div>
        </div>
        <span id="nutrition-tag" class="text-[11px] font-black px-2.5 py-0.5 rounded-full bg-red-900/60 border border-orange-500/40 text-orange-200"></span>
      </div>

      <!-- 栄養素の役割解説 -->
      <div class="bg-orange-950/20 border border-orange-500/20 rounded-xl p-3 mb-3 text-xs text-orange-100">
        <div class="flex items-start gap-2">
          <span class="text-amber-400 font-black shrink-0">🦍 理由:</span>
          <span id="nutrition-reason" class="text-[11px] leading-relaxed text-orange-200/90 font-medium"></span>
        </div>
      </div>

      <!-- チェックリスト -->
      <div class="space-y-2" id="nutrition-checklist"></div>
    </section>

    <!-- トレーニングセクション -->
    <section class="bg-neutral-950/85 backdrop-blur-md rounded-2xl p-4 mb-4 flame-border">
      <div class="flex items-center justify-between border-b border-orange-900/40 pb-2 mb-3">
        <div class="flex items-center gap-2">
          <span class="p-1.5 rounded-lg bg-red-600/30 text-red-400 text-sm">
            <i class="fa-solid fa-dumbbell"></i>
          </span>
          <div>
            <h2 class="text-sm font-black text-white">脚痩せバーニングトレ</h2>
            <p class="text-[10px] text-orange-400 font-bold" id="workout-theme"></p>
          </div>
        </div>
        <button id="open-timer-btn" class="text-xs bg-orange-950 border border-orange-600/60 text-amber-300 font-bold px-2.5 py-1 rounded-lg active:scale-95 transition-transform flex items-center gap-1">
          <i class="fa-solid fa-stopwatch"></i> タイマー
        </button>
      </div>

      <!-- 種目リスト -->
      <div class="space-y-2.5" id="workout-list"></div>
    </section>

    <!-- 水分・リカバリーセクション -->
    <section class="bg-neutral-950/85 backdrop-blur-md rounded-2xl p-4 mb-4 flame-border">
      <div class="flex items-center justify-between border-b border-orange-900/40 pb-2 mb-3">
        <div class="flex items-center gap-2">
          <span class="p-1.5 rounded-lg bg-amber-600/30 text-amber-400 text-sm">
            <i class="fa-solid fa-droplet"></i>
          </span>
          <div>
            <h2 class="text-sm font-black text-white">むくみ排出 水分トラッカー</h2>
            <p class="text-[10px] text-neutral-400">常温水で巡りをMAXにする（目標 2.0L）</p>
          </div>
        </div>
        <span id="water-count" class="text-xs font-black text-amber-300">0 / 8杯</span>
      </div>

      <!-- 水分アイコン 8杯 -->
      <div class="grid grid-cols-8 gap-1.5 mb-3" id="water-grid"></div>

      <!-- 湯船・リカバリーチェック -->
      <div id="bath-container" class="border-t border-orange-950 pt-2.5"></div>
    </section>

    <!-- メモセクション -->
    <section class="bg-neutral-950/85 backdrop-blur-md rounded-2xl p-4 mb-4 flame-border">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-black text-orange-300 flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square"></i> 今日の脚コンディションメモ
        </span>
      </div>
      <textarea id="daily-note" rows="2" placeholder="むくみの強さ、内ももの張り、食べたものメモ..." class="w-full bg-black/60 border border-orange-900/50 rounded-xl p-2.5 text-xs text-orange-100 placeholder-neutral-600 focus:outline-none focus:border-orange-500"></textarea>
    </section>

  </div>

  <!-- 内蔵タイマーモーダル -->
  <div id="timer-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-neutral-950 border border-orange-500/60 rounded-2xl p-5 w-full max-w-xs text-center flame-glow relative">
      <button id="close-timer-btn" class="absolute top-3 right-3 text-neutral-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="text-sm font-black text-orange-400 mb-1">INTERVAL & STRETCH</h3>
      <p class="text-[10px] text-neutral-400 mb-4">呼吸を止めず、狙った筋肉に全集中！</p>
      
      <div id="timer-display" class="font-heavy text-5xl text-amber-300 tracking-wider mb-5 drop-shadow-[0_0_10px_#ff9900]">
        00:30
      </div>

      <div class="flex justify-center gap-2 mb-5">
        <button class="timer-preset-btn px-2.5 py-1 text-xs font-bold rounded-lg bg-orange-950 border border-orange-800 text-orange-300" data-seconds="30">30秒</button>
        <button class="timer-preset-btn px-2.5 py-1 text-xs font-bold rounded-lg bg-orange-950 border border-orange-800 text-orange-300" data-seconds="60">1分</button>
        <button class="timer-preset-btn px-2.5 py-1 text-xs font-bold rounded-lg bg-orange-950 border border-orange-800 text-orange-300" data-seconds="120">2分</button>
      </div>

      <div class="flex gap-2">
        <button id="timer-toggle-btn" class="flex-1 py-2.5 bg-gradient-to-r from-orange-600 to-amber-600 font-black text-sm text-black rounded-xl active:scale-95 transition-transform shadow-[0_0_15px_#ff5500]">
          START
        </button>
        <button id="timer-reset-btn" class="px-4 py-2.5 bg-neutral-900 border border-neutral-700 text-xs font-bold text-neutral-300 rounded-xl">
          RESET
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1週間のプログラムデータ
    const PROGRAM_DATA = [
      {
        dayKey: 'mon', dayName: '月曜', short: '月',
        workoutTheme: '骨盤＆内もも引き締め（隙間メイク）',
        exercises: [
          { id: 'mon-1', name: 'クラムシェル', reps: '左右各20回 × 2', tip: '骨盤の開きを引き締め、お尻上部に効かせる。骨盤を前後に倒さないのが鉄則！' },
          { id: 'mon-2', name: 'ワイドスクワット', reps: '20回 × 2セット', tip: '膝を外にしっかり開き、かかとで床を押す。前ももを使わず内ももを刺激！' }
        ],
        nutrition: {
          tag: 'カリウム徹底チャージ',
          targetName: 'カリウム',
          reason: '週初めのむくみを一掃！体内の余分な塩分と水分を押し出してふくらはぎをスッキリさせる。',
          items: [
            { id: 'nut-mon-1', name: 'アボカド（1/2個）または バナナ' },
            { id: 'nut-mon-2', name: 'ほうれん草のおひたし or 海藻サラダ' },
            { id: 'nut-mon-3', name: 'コンビニ活用: もち麦おにぎり＋納豆パック' }
          ]
        }
      },
      {
        dayKey: 'tue', dayName: '火曜', short: '火',
        workoutTheme: 'むくみ徹底流し＆深部ストレッチ',
        exercises: [
          { id: 'tue-1', name: 'フロッグストレッチ', reps: '1分間 キープ', tip: '股関節の可動域を広げ、前ももの過緊張を緩める。呼吸は深くゆったり。' },
          { id: 'tue-2', name: '壁を使った足上げリセット', reps: '5分間 キープ', tip: '重力で下半身に溜まった血液・リンパを心臓へ戻す。足首を時々パタパタ動かす。' },
          { id: 'tue-3', name: 'ふくらはぎ＆足首ほぐし', reps: '左右各1分', tip: '第二の心臓・ふくらはぎを優しく下から上へ撫で上げるように流す。' }
        ],
        nutrition: {
          tag: '高タンパク＆ビタミンB群',
          targetName: '良質タンパク質・ビタミンB',
          reason: '代謝エンジンを回して筋肉の回復を促進。脂肪燃焼の効率を一気に高める！',
          items: [
            { id: 'nut-tue-1', name: '蒸し鶏（サラダチキン）または 豚ヒレ肉' },
            { id: 'nut-tue-2', name: 'キウイフルーツ（ビタミンC＆カリウム）' },
            { id: 'nut-tue-3', name: '大豆製品（無調整豆乳または冷奴）' }
          ]
        }
      },
      {
        dayKey: 'wed', dayName: '水曜', short: '水',
        workoutTheme: 'ヒップアップ＆裏もも刺激（脚長効果）',
        exercises: [
          { id: 'wed-1', name: 'ヒップリフト足裏合わせ', reps: '20回 × 3セット', tip: '足裏同士を合わせて膝を開いてお尻を上げる。前ももを完全にオフにしてヒップを直撃！' },
          { id: 'wed-2', name: 'ドンキーキック', reps: '左右各15回 × 2', tip: '足裏で天井を蹴り上げるイメージ。腰を反らさずお尻の収縮だけを感じる。' }
        ],
        nutrition: {
          tag: '鉄分＆ビタミンC補給',
          targetName: '鉄分・血流アップ成分',
          reason: '女性が不足しやすい鉄分をチャージ。酸素を行き渡らせて冷えと代謝低下を撃退！',
          items: [
            { id: 'nut-wed-1', name: 'マグロの赤身（刺身）または 牛赤身肉' },
            { id: 'nut-wed-2', name: 'ひじきの煮物 or ほうれん草' },
            { id: 'nut-wed-3', name: '温かい具だくさんお味噌汁（ワカメ・豆腐）' }
          ]
        }
      },
      {
        dayKey: 'thu', dayName: '木曜', short: '木',
        workoutTheme: '張り解消＆筋膜リリースデイ',
        exercises: [
          { id: 'thu-1', name: '湯船で足首回し＆リフレッシュ', reps: '15分入浴', tip: '38〜40度のお湯で深部体温を上げ、硬くなった筋肉を完全に弛緩させる。' },
          { id: 'thu-2', name: '太もも外側・前側の筋膜ほぐし', reps: '左右各2分', tip: '手やローラーで外ももの張りを念入りに緩める。ここが緩むと脚の横幅が細くなる！' }
        ],
        nutrition: {
          tag: '食物繊維＆デトックス',
          targetName: '水溶性食物繊維',
          reason: '腸内環境を整えて老廃物を排出。ポッコリお腹と下半身の巡りを同時に改善！',
          items: [
            { id: 'nut-thu-1', name: 'きのこ類（エリンギ・しめじ・舞茸）たっぷりスープ' },
            { id: 'nut-thu-2', name: 'オートミール または もち麦ごはん' },
            { id: 'nut-thu-3', name: '海藻類（ワカメ・めかぶ・もずく酢）' }
          ]
        }
      },
      {
        dayKey: 'fri', dayName: '金曜', short: '金',
        workoutTheme: '美脚ライン形成＆引き締め',
        exercises: [
          { id: 'fri-1', name: 'カエル足パカ', reps: '30回 × 2セット', tip: '仰向けで足裏を合わせ、カエルのように曲げ伸ばし。内ももと下腹部を同時に引き締める！' },
          { id: 'fri-2', name: 'サイドレッグレイズ', reps: '左右各20回 × 2', tip: '真横よりやや後ろ斜めにお尻の力で持ち上げる。骨盤の傾きをリセット！' }
        ],
        nutrition: {
          tag: '良質オメガ3脂肪酸',
          targetName: 'オメガ3脂肪酸・EPA/DHA',
          reason: '血管をしなやかにして下半身の血流を加速。細胞膜を柔らかくしてむくみにくい体へ。',
          items: [
            { id: 'nut-fri-1', name: '焼き鮭 または サバ缶水煮' },
            { id: 'nut-fri-2', name: 'ミックスナッツ（無塩・手のひら一杯）' },
            { id: 'nut-fri-3', name: 'オリーブオイル または えごま油をひと回し' }
          ]
        }
      },
      {
        dayKey: 'sat', dayName: '土曜', short: '土',
        workoutTheme: '姿勢リセット＆美脚ウォーキング',
        exercises: [
          { id: 'sat-1', name: '骨盤前傾（反り腰）リセットストレッチ', reps: '左右各1分', tip: '腸腰筋（股関節前側）をじっくり伸ばし、反り腰による前もも荷重を根本から防ぐ。' },
          { id: 'sat-2', name: 'かかと着地ウォーキング', reps: '20〜30分', tip: 'お尻を使って大股で歩く。つま先だけでペタペタ歩かないこと！' }
        ],
        nutrition: {
          tag: '高タンパク・クリーン燃焼',
          targetName: 'クリーンタンパク質',
          reason: '外食でもOK！ただし脂っこい揚げ物は避け、魚やお肉本来のタンパク質を贅沢に。',
          items: [
            { id: 'nut-sat-1', name: '好きなお寿司（マグロ赤身・タコ・イカ中心に6〜8貫）' },
            { id: 'nut-sat-2', name: '赤身ステーキ または 焼き鳥（塩）' },
            { id: 'nut-sat-3', name: '柑橘類（グレープフルーツなどクエン酸補給）' }
          ]
        }
      },
      {
        dayKey: 'sun', dayName: '日曜', short: '日',
        workoutTheme: '深部リンパ流し＆翌週準備',
        exercises: [
          { id: 'sun-1', name: '寝ながら股関節回し', reps: '内・外各10回', tip: '仰向けで膝を大きく円を描くように回す。股関節の詰まりを全部取る。' },
          { id: 'sun-2', name: 'お尻＆もも裏ディープストレッチ', reps: '左右各1分', tip: '座って片足を4の字に組み、上体を前に倒す。翌週に疲労を残さない。' }
        ],
        nutrition: {
          tag: '温活・生姜＆ミネラル',
          targetName: '生姜・ミネラルスープ',
          reason: '胃腸を休め、体を芯から温めて翌朝のむくみゼロを目指すナイトルーティン。',
          items: [
            { id: 'nut-sun-1', name: '白菜と豚肉の生姜ミルフィーユ鍋（ポン酢で）' },
            { id: 'nut-sun-2', name: '納豆キムチ（発酵食品で腸内ケア）' },
            { id: 'nut-sun-3', name: '就寝前の白湯 または ルイボスティー' }
          ]
        }
      }
    ];

    // 状態管理
    let currentDayIndex = 0;
    const todayJsDay = new Date().getDay(); // 0: 日, 1: 月...
    const dayMap = [6, 0, 1, 2, 3, 4, 5]; // 日曜=6, 月曜=0...
    currentDayIndex = dayMap[todayJsDay];

    function getStorageKey() {
      return `gori_burn_tracker_${PROGRAM_DATA[currentDayIndex].dayKey}`;
    }

    function loadDayState() {
      const saved = localStorage.getItem(getStorageKey());
      if (saved) {
        try { return JSON.parse(saved); } catch (e) { }
      }
      return { checks: {}, water: 0, bath: false, note: '' };
    }

    function saveDayState(state) {
      localStorage.setItem(getStorageKey(), JSON.stringify(state));
      updateProgress();
    }

    // レンダリング
    function renderApp() {
      renderNav();
      renderContent();
      updateProgress();
    }

    function renderNav() {
      const nav = document.getElementById('days-nav');
      nav.innerHTML = '';
      PROGRAM_DATA.forEach((d, idx) => {
        const isSelected = idx === currentDayIndex;
        const isRealToday = idx === dayMap[todayJsDay];

        const btn = document.createElement('button');
        btn.className = `flex-1 min-w-[50px] py-2 px-1 rounded-xl text-center flex flex-col items-center transition-all ${
          isSelected 
            ? 'bg-gradient-to-b from-orange-500 to-red-600 text-black font-black shadow-[0_0_12px_#ff4400] scale-105' 
            : 'bg-neutral-900/90 text-neutral-400 border border-neutral-800'
        }`;
        
        btn.innerHTML = `
          <span class="text-[10px] uppercase font-bold tracking-tighter">${d.short}</span>
          <span class="text-xs font-black">${d.dayName.replace('曜','')}</span>
          ${isRealToday ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-300 mt-0.5 animate-ping"></span>' : ''}
        `;

        btn.onclick = () => {
          currentDayIndex = idx;
          renderApp();
        };
        nav.appendChild(btn);
      });
    }

    function renderContent() {
      const day = PROGRAM_DATA[currentDayIndex];
      const state = loadDayState();

      // 栄養素ヘッダー
      document.getElementById('nutrition-tag').textContent = day.nutrition.tag;
      document.getElementById('nutrition-reason').textContent = day.nutrition.reason;

      // 栄養素チェックリスト
      const nutContainer = document.getElementById('nutrition-checklist');
      nutContainer.innerHTML = '';
      day.nutrition.items.forEach(item => {
        const isChecked = !!state.checks[item.id];
        const row = document.createElement('div');
        row.className = `flex items-center gap-3 p-2.5 rounded-xl border transition-all cursor-pointer ${
          isChecked ? 'bg-orange-950/40 border-orange-600/50 text-orange-200' : 'bg-black/40 border-neutral-800 text-neutral-300 hover:border-neutral-700'
        }`;
        row.innerHTML = `
          <div class="w-5 h-5 rounded-md flex items-center justify-center text-xs transition-colors ${
            isChecked ? 'bg-orange-500 text-black font-black' : 'border border-neutral-600 bg-neutral-900'
          }">
            ${isChecked ? '<i class="fa-solid fa-check"></i>' : ''}
          </div>
          <span class="text-xs font-bold leading-tight flex-1 ${isChecked ? 'line-through text-neutral-400' : ''}">${item.name}</span>
        `;
        row.onclick = () => {
          state.checks[item.id] = !state.checks[item.id];
          saveDayState(state);
          renderContent();
        };
        nutContainer.appendChild(row);
      });

      // ワークアウト
      document.getElementById('workout-theme').textContent = day.workoutTheme;
      const workoutList = document.getElementById('workout-list');
      workoutList.innerHTML = '';

      day.exercises.forEach(ex => {
        const isChecked = !!state.checks[ex.id];
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border transition-all ${
          isChecked ? 'bg-orange-950/30 border-orange-600/50 text-orange-200' : 'bg-black/40 border-neutral-800 text-white'
        }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5 flex-1 cursor-pointer" onclick="toggleTask('${ex.id}')">
              <div class="w-5 h-5 rounded-md flex items-center justify-center text-xs shrink-0 ${
                isChecked ? 'bg-orange-500 text-black font-black' : 'border border-neutral-600 bg-neutral-900'
              }">
                ${isChecked ? '<i class="fa-solid fa-check"></i>' : ''}
              </div>
              <div>
                <h4 class="text-xs font-black ${isChecked ? 'line-through text-neutral-400' : ''}">${ex.name}</h4>
                <span class="text-[10px] text-amber-400/90 font-bold">${ex.reps}</span>
              </div>
            </div>
            <button onclick="toggleTip('${ex.id}')" class="text-neutral-500 hover:text-orange-400 p-1 text-xs">
              <i class="fa-solid fa-circle-question"></i>
            </button>
          </div>
          <div id="tip-${ex.id}" class="mt-2.5 pt-2 border-t border-orange-950 text-[11px] text-orange-300 hidden">
            <span class="font-black text-amber-400">🦍 意識POINT:</span> ${ex.tip}
          </div>
        `;
        workoutList.appendChild(card);
      });

      // 水分
      document.getElementById('water-count').textContent = `${state.water || 0} / 8杯 (${(state.water || 0) * 250}ml)`;
      const waterGrid = document.getElementById('water-grid');
      waterGrid.innerHTML = '';
      for (let i = 1; i <= 8; i++) {
        const isFilled = i <= (state.water || 0);
        const glass = document.createElement('button');
        glass.className = `h-9 rounded-lg flex items-center justify-center transition-all ${
          isFilled 
            ? 'bg-gradient-to-t from-amber-500 to-orange-400 text-black font-black shadow-[0_0_8px_#ff9900]' 
            : 'bg-neutral-900 border border-neutral-800 text-neutral-600'
        }`;
        glass.innerHTML = `<i class="fa-solid fa-droplet text-xs"></i>`;
        glass.onclick = () => {
          state.water = (state.water === i) ? i - 1 : i;
          saveDayState(state);
          renderContent();
        };
        waterGrid.appendChild(glass);
      }

      // 湯船チェック
      const bathContainer = document.getElementById('bath-container');
      const isBath = !!state.bath;
      bathContainer.innerHTML = `
        <div class="flex items-center justify-between p-2.5 rounded-xl border cursor-pointer ${
          isBath ? 'bg-orange-950/40 border-orange-600/50 text-orange-200' : 'bg-black/30 border-neutral-800 text-neutral-400'
        }" onclick="toggleBath()">
          <div class="flex items-center gap-2">
            <span class="text-sm text-amber-400"><i class="fa-solid fa-bath"></i></span>
            <span class="text-xs font-black">湯船に15分浸かって深部血流UP</span>
          </div>
          <div class="w-5 h-5 rounded-md flex items-center justify-center text-xs ${
            isBath ? 'bg-orange-500 text-black font-black' : 'border border-neutral-600'
          }">
            ${isBath ? '<i class="fa-solid fa-check"></i>' : ''}
          </div>
        </div>
      `;

      // メモ
      const noteElem = document.getElementById('daily-note');
      noteElem.value = state.note || '';
      noteElem.oninput = (e) => {
        state.note = e.target.value;
        localStorage.setItem(getStorageKey(), JSON.stringify(state));
      };
    }

    window.toggleTask = function(taskId) {
      const state = loadDayState();
      state.checks[taskId] = !state.checks[taskId];
      saveDayState(state);
      renderContent();
    };

    window.toggleTip = function(taskId) {
      const tipElem = document.getElementById(`tip-${taskId}`);
      tipElem.classList.toggle('hidden');
    };

    window.toggleBath = function() {
      const state = loadDayState();
      state.bath = !state.bath;
      saveDayState(state);
      renderContent();
    };

    function updateProgress() {
      const day = PROGRAM_DATA[currentDayIndex];
      const state = loadDayState();

      // 全タスク数 = トレ数 + 栄養素数 + 水分(8杯で1タスク) + 湯船
      const totalItems = day.exercises.length + day.nutrition.items.length + 2;
      let completed = 0;

      day.exercises.forEach(ex => { if (state.checks[ex.id]) completed++; });
      day.nutrition.items.forEach(nut => { if (state.checks[nut.id]) completed++; });
      if (state.water >= 6) completed++; // 6杯以上で達成カウント
      if (state.bath) completed++;

      const pct = Math.min(100, Math.round((completed / totalItems) * 100));
      document.getElementById('burn-percentage').textContent = `${pct}%`;
      document.getElementById('burn-bar').style.width = `${pct}%`;

      const cheerElem = document.getElementById('burn-cheer');
      if (pct === 100) {
        cheerElem.textContent = '🦍🔥 脂肪完全燃焼！パーフェクトバルク達成！';
        cheerElem.className = 'text-xs text-amber-300 font-black mt-2 text-center animate-bounce';
        triggerFireCelebration();
      } else if (pct >= 50) {
        cheerElem.textContent = '🔥 燃えてきた！内ももとお尻が覚醒中！';
        cheerElem.className = 'text-[11px] text-orange-400 font-bold mt-2 text-center';
      } else {
        cheerElem.textContent = 'タップして今日の燃焼タスクを完了せよ！';
        cheerElem.className = 'text-[11px] text-neutral-400 mt-2 font-bold text-center';
      }
    }

    function triggerFireCelebration() {
      confetti({
        particleCount: 50,
        spread: 80,
        origin: { y: 0.7 },
        colors: ['#ff2200', '#ff7700', '#ffcc00', '#ffffff']
      });
    }

    // タイマー機能
    let timerSec = 30;
    let currentTimerSec = 30;
    let timerInterval = null;

    const timerModal = document.getElementById('timer-modal');
    const timerDisplay = document.getElementById('timer-display');
    const timerToggleBtn = document.getElementById('timer-toggle-btn');

    document.getElementById('open-timer-btn').onclick = () => timerModal.classList.remove('hidden');
    document.getElementById('close-timer-btn').onclick = () => {
      timerModal.classList.add('hidden');
      stopTimer();
    };

    function updateTimerDisplay(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      timerDisplay.textContent = `${m}:${s}`;
    }

    document.querySelectorAll('.timer-preset-btn').forEach(btn => {
      btn.onclick = () => {
        stopTimer();
        timerSec = parseInt(btn.getAttribute('data-seconds'));
        currentTimerSec = timerSec;
        updateTimerDisplay(currentTimerSec);
      };
    });

    timerToggleBtn.onclick = () => {
      if (timerInterval) {
        stopTimer();
      } else {
        startTimer();
      }
    };

    document.getElementById('timer-reset-btn').onclick = () => {
      stopTimer();
      currentTimerSec = timerSec;
      updateTimerDisplay(currentTimerSec);
    };

    function startTimer() {
      timerToggleBtn.textContent = 'PAUSE';
      timerToggleBtn.classList.replace('from-orange-600', 'from-red-600');
      timerInterval = setInterval(() => {
        currentTimerSec--;
        updateTimerDisplay(currentTimerSec);
        if (currentTimerSec <= 0) {
          stopTimer();
          triggerFireCelebration();
          currentTimerSec = timerSec;
          updateTimerDisplay(currentTimerSec);
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerToggleBtn.textContent = 'START';
      timerToggleBtn.classList.replace('from-red-600', 'from-orange-600');
    }

    // 火の粉パーティクルアニメーション
    const canvas = document.getElementById('fire-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Ember {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 10;
        this.size = Math.random() * 2.5 + 0.8;
        this.speedY = Math.random() * 1.5 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.alpha = 1;
        this.decay = Math.random() * 0.008 + 0.004;
        this.hue = Math.random() * 30 + 10; // 赤〜オレンジ〜黄色
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.alpha -= this.decay;
        if (this.alpha <= 0 || this.y < 0) {
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 55%, ${this.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new Ember());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 初期起動
    renderApp();
  </script>
</body>
</html>
