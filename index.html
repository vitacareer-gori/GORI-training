<!DOCTYPE html>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            roseBeige: {
              50: '#FDFBF9',
              100: '#F8F4F0',
              200: '#EFE7E0',
              300: '#E2D4C8',
              400: '#C7B1A1',
              500: '#A98D7B',
              600: '#8A6F5E',
              700: '#6C5447',
              800: '#4F3D34',
              900: '#342721',

              light: '#FBF8F3',
              DEFAULT: '#D4AF37',
              gold: '#C5A059',
              glow: 'rgba(212, 175, 55, 0.15)',

              deep: '#9E5B4B'

  <style>
    /* Smooth touch interactions & mobile polish */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: auto;
    }
    /* Hide scrollbars for slick mobile tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Custom Checkbox Animation */
    .lux-checkbox {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 1.5px solid #D8C7BC;
      border-radius: 7px;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: #FFFFFF;
      flex-shrink: 0;
    }
    .lux-checkbox:checked {
      background: linear-gradient(135deg, #C5A059, #A98D7B);
      border-color: #A98D7B;
      box-shadow: 0 2px 8px rgba(169, 141, 123, 0.35);
    }
    .lux-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 6.5px;
      top: 3px;
      width: 6px;
      height: 11px;
      border: solid #FFFFFF;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    
    /* Elegant pulse */
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .pulse-subtle {
      animation: gentlePulse 3s infinite ease-in-out;
    }
  </style>
</head>

<body class="bg-roseBeige-50 text-stone-800 font-sans min-h-screen flex justify-center selection:bg-champagne-gold selection:text-white pb-28">

  <!-- Mobile Container (Max 440px wide for native app feeling) -->

    <header class="pt-8 pb-4 px-6 bg-gradient-to-b from-[#FAF6F2] via-roseBeige-50 to-roseBeige-50 sticky top-0 z-30 backdrop-blur-md border-b border-roseBeige-200/60">
      <div class="flex items-center justify-between mb-3">
        <div>
          <span class="text-[10px] tracking-[0.25em] uppercase text-roseBeige-500 font-serifTitle block">Aesthetic Routine</span>

        </div>
        <button id="openTimerBtn" class="flex items-center gap-1.5 text-xs bg-white/80 border border-roseBeige-300/80 px-3 py-1.5 rounded-full shadow-sm text-roseBeige-700 active:scale-95 transition-all">

        </button>
      </div>

      <!-- Weekly Progress Summary -->

          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-champagne-gold"></span>
            <span class="text-roseBeige-600 font-medium tracking-tight">今週の達成率</span>

        </div>
        <div class="w-full bg-roseBeige-200 h-2 rounded-full overflow-hidden">

        <div class="flex justify-between items-center mt-2 pt-2 border-t border-roseBeige-100 text-[11px] text-stone-500">

    const STORAGE_KEY = 'elegance_jambes_v1';
    
    // Day order array
    const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

    // Map JS Sunday(0)-Saturday(6) to our keys
    function getTodayKey() {
      const dayMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
      return dayMap[new Date().getDay()];
    }

    let appState = {
      activeDay: getTodayKey(),
      checkedItems: {}, // key: 'mon_w1' => boolean
      waterGlasses: {}, // key: 'mon_0' => boolean
      baths: {},        // key: 'mon' => boolean
      notes: {}         // key: 'mon' => string
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          appState = { ...appState, ...parsed };
        }
      } catch (e) {
        console.error('Failed to load localStorage', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Failed to save localStorage', e);
      }
    }

    function renderDayTabs() {
      const container = document.getElementById('dayTabsContainer');
      container.innerHTML = '';
      const today = getTodayKey();

      DAY_KEYS.forEach(k => {
        const data = PROGRAM_DATA[k];
        const isActive = appState.activeDay === k;
        const isToday = today === k;

        // Calculate that day's mini progress dot
        const totalItems = data.workouts.length + 3 + 1; // workouts + 3 meals + bath
        let doneItems = 0;
        data.workouts.forEach(w => { if (appState.checkedItems[w.id]) doneItems++; });
        ['breakfast', 'lunch', 'dinner'].forEach(m => { if (appState.checkedItems[`${k}_${m}`]) doneItems++; });
        if (appState.baths[k]) doneItems++;
        const isDone = doneItems === totalItems;

        const btn = document.createElement('button');
        btn.className = `flex-1 py-2 px-1 rounded-2xl flex flex-col items-center transition-all duration-200 relative ${
          isActive 
            ? 'bg-gradient-to-b from-stone-900 to-stone-800 text-white shadow-md' 
            : 'bg-white/80 border border-roseBeige-200/90 text-roseBeige-700 hover:bg-roseBeige-100'
        }`;

        btn.innerHTML = `
          ${isToday ? '<span class="absolute -top-1 w-1.5 h-1.5 rounded-full bg-champagne-gold"></span>' : ''}
          <span class="text-[9px] font-serifTitle ${isActive ? 'text-champagne-light' : 'text-stone-400'}">${data.en}</span>
          <span class="text-xs font-semibold mt-0.5">${data.name}</span>
          <span class="w-1.5 h-1.5 rounded-full mt-1 ${isDone ? 'bg-champagne-gold' : (isActive ? 'bg-stone-700' : 'bg-roseBeige-200')}"></span>
        `;

        btn.onclick = () => {
          appState.activeDay = k;
          saveState();
          renderApp();
        };

        container.appendChild(btn);
      });
    }

    function renderDayContent() {
      const current = PROGRAM_DATA[appState.activeDay];

      // Update Theme Header
      document.getElementById('currentDayBadge').innerText = `${current.en} ・ 第${DAY_KEYS.indexOf(current.key) + 1}日目`;
      document.getElementById('dayThemeTitle').innerText = current.theme;
      document.getElementById('dayThemeDesc').innerText = current.desc;

      // Render Workouts
      const workoutContainer = document.getElementById('workoutList');
      workoutContainer.innerHTML = '';

      current.workouts.forEach(item => {
        const checked = !!appState.checkedItems[item.id];
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-2xl border transition-all duration-200 ${
          checked 
            ? 'bg-roseBeige-100/50 border-roseBeige-300/80 opacity-90' 
            : 'bg-roseBeige-50/50 border-roseBeige-200 hover:border-roseBeige-300'
        }`;

        card.innerHTML = `
          <div class="flex items-start gap-3">
            <input type="checkbox" data-id="${item.id}" class="lux-checkbox workout-check mt-1" ${checked ? 'checked' : ''}>
            <div class="flex-1">
              <div class="flex items-baseline justify-between cursor-pointer accordion-trigger">
                <h4 class="text-xs font-semibold text-stone-900 ${checked ? 'line-through text-stone-400' : ''}">${item.title}</h4>
                <span class="text-[11px] text-champagne-gold font-serifTitle font-bold">${item.reps}</span>
              </div>
              <p class="text-[10px] text-roseBeige-600 mt-0.5 font-medium">狙い: ${item.target}</p>
              
              <!-- Expandable Form Tips -->
              <div class="tips-detail text-[11px] text-stone-600 mt-2 pt-2 border-t border-roseBeige-200/70 hidden leading-relaxed bg-white/70 p-2.5 rounded-xl">
                <span class="text-roseBeige-700 font-semibold block mb-0.5">美脚ポイント：</span>
                ${item.tip}
              </div>
            </div>
          </div>
        `;

        // Toggle Tips on title click
        const trigger = card.querySelector('.accordion-trigger');
        const detail = card.querySelector('.tips-detail');
        trigger.addEventListener('click', () => {
          detail.classList.toggle('hidden');
        });

        // Checkbox listener
        const chk = card.querySelector('.workout-check');
        chk.addEventListener('change', (e) => {
          appState.checkedItems[item.id] = e.target.checked;
          saveState();
          checkCelebrate();
          renderApp();
        });

        workoutContainer.appendChild(card);
      });

      // Render Meals (Breakfast, Lunch, Dinner)
      const mealContainer = document.getElementById('mealList');
      mealContainer.innerHTML = '';
      const mealTypes = [
        { type: 'breakfast', label: '朝', data: current.meals.breakfast },
        { type: 'lunch', label: '昼', data: current.meals.lunch },
        { type: 'dinner', label: '夜', data: current.meals.dinner }
      ];

      mealTypes.forEach(m => {
        const id = `${current.key}_${m.type}`;
        const checked = !!appState.checkedItems[id];

        const card = document.createElement('label');
        card.className = `flex items-start gap-3 p-3.5 rounded-2xl border transition-all cursor-pointer ${
          checked 
            ? 'bg-roseBeige-100/50 border-roseBeige-300/80 opacity-90' 
            : 'bg-roseBeige-50/50 border-roseBeige-200 hover:border-roseBeige-300'
        }`;

        card.innerHTML = `
          <input type="checkbox" data-id="${id}" class="lux-checkbox meal-check mt-1" ${checked ? 'checked' : ''}>
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-stone-900 ${checked ? 'line-through text-stone-400' : ''}">${m.data.title}</span>
              <span class="text-[10px] bg-roseBeige-200 text-roseBeige-800 px-1.5 py-0.5 rounded font-serifTitle">${m.label}</span>
            </div>
            <p class="text-xs text-stone-700 mt-1 font-medium ${checked ? 'text-stone-400' : ''}">${m.data.detail}</p>
            <p class="text-[10px] text-nudePink-deep mt-1 bg-white/60 p-1.5 rounded-lg">効果: ${m.data.point}</p>
          </div>
        `;

        const chk = card.querySelector('.meal-check');
        chk.addEventListener('change', (e) => {
          appState.checkedItems[id] = e.target.checked;
          saveState();
          checkCelebrate();
          renderApp();
        });

        mealContainer.appendChild(card);
      });

      // Render Water Intake (8 glasses = 2000ml)
      const waterContainer = document.getElementById('waterGlassesContainer');
      waterContainer.innerHTML = '';
      let waterCount = 0;

      for (let i = 0; i < 8; i++) {
        const glassId = `${current.key}_glass_${i}`;
        const isFilled = !!appState.waterGlasses[glassId];
        if (isFilled) waterCount++;

        const glassBtn = document.createElement('button');
        glassBtn.className = `h-10 rounded-xl flex flex-col items-center justify-center transition-all ${
          isFilled 
            ? 'bg-gradient-to-t from-sky-400 to-sky-200 text-white shadow-sm scale-95' 
            : 'bg-white border border-roseBeige-200 text-roseBeige-300 hover:border-sky-300'
        }`;
        glassBtn.innerHTML = `
          <svg class="w-4 h-4 ${isFilled ? 'text-white' : 'text-stone-300'}" fill="currentColor" viewBox="0 0 20 20">
            <path d="M7 2a1 1 0 00-.707 1.707L7 4.414v9.172a3 3 0 003 3 3 3 0 003-3V4.414l.707-.707A1 1 0 0013 2H7z"/>
          </svg>
          <span class="text-[8px] mt-0.5 font-serifTitle ${isFilled ? 'text-white font-bold' : 'text-stone-400'}">${(i+1)*250}</span>
        `;

        glassBtn.onclick = () => {
          appState.waterGlasses[glassId] = !appState.waterGlasses[glassId];
          saveState();
          renderApp();
        };

        waterContainer.appendChild(glassBtn);
      }

      document.getElementById('waterMlText').innerText = `${waterCount * 250} / 2000 ml`;

      // Bath & Circulation Checkbox
      const bathCheckbox = document.getElementById('bathCheck');
      bathCheckbox.checked = !!appState.baths[current.key];
      bathCheckbox.onchange = (e) => {
        appState.baths[current.key] = e.target.checked;
        saveState();
        checkCelebrate();
        renderApp();
      };

      // Daily Reflection Note
      const noteInput = document.getElementById('dailyNoteInput');
      noteInput.value = appState.notes[current.key] || '';
      noteInput.oninput = (e) => {
        appState.notes[current.key] = e.target.value;
        saveState();
        showNoteSaved();
      };

      // Update Completion Numbers for this day
      updateCalculations();
    }

    // Auto-save feedback for notes
    let saveTimeout;
    function showNoteSaved() {
      const indicator = document.getElementById('noteSaveIndicator');
      indicator.style.opacity = '1';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        indicator.style.opacity = '0';
      }, 1500);
    }

    function updateCalculations() {
      const current = PROGRAM_DATA[appState.activeDay];

      // Day Progress
      const dayTotal = current.workouts.length + 3 + 1; // workouts + 3 meals + bath
      let dayDone = 0;
      current.workouts.forEach(w => { if (appState.checkedItems[w.id]) dayDone++; });
      ['breakfast', 'lunch', 'dinner'].forEach(m => { if (appState.checkedItems[`${current.key}_${m}`]) dayDone++; });
      if (appState.baths[current.key]) dayDone++;

      const dayRatio = dayTotal > 0 ? Math.round((dayDone / dayTotal) * 100) : 0;
      document.getElementById('dayCompletionRatio').innerText = `${dayDone} / ${dayTotal} 完了`;
      document.getElementById('footerPercent').innerText = `${dayRatio}%`;

      // Week Progress
      let weekTotal = 0;
      let weekDone = 0;

      DAY_KEYS.forEach(k => {
        const dayData = PROGRAM_DATA[k];
        weekTotal += dayData.workouts.length + 3 + 1;

        dayData.workouts.forEach(w => {
          if (appState.checkedItems[w.id]) weekDone++;
        });
        ['breakfast', 'lunch', 'dinner'].forEach(m => {
          if (appState.checkedItems[`${k}_${m}`]) weekDone++;
        });
        if (appState.baths[k]) weekDone++;
      });

      const weekPercent = weekTotal > 0 ? Math.round((weekDone / weekTotal) * 100) : 0;
      document.getElementById('weeklyPercentText').innerText = `${weekPercent}%`;
      document.getElementById('weeklyProgressBar').style.width = `${weekPercent}%`;
      document.getElementById('completedItemsCount').innerText = `完了: ${weekDone} / ${weekTotal} 項目`;
    }

    // Celebration Confetti
    function checkCelebrate() {
      const current = PROGRAM_DATA[appState.activeDay];
      const dayTotal = current.workouts.length + 3 + 1;
      let dayDone = 0;
      current.workouts.forEach(w => { if (appState.checkedItems[w.id]) dayDone++; });
      ['breakfast', 'lunch', 'dinner'].forEach(m => { if (appState.checkedItems[`${current.key}_${m}`]) dayDone++; });
      if (appState.baths[current.key]) dayDone++;

      if (dayDone === dayTotal) {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 70,
            spread: 60,
            origin: { y: 0.7 },
            colors: ['#D4AF37', '#A98D7B', '#F4ECE8', '#C5A059']
          });
        }
      }
    }

    function renderApp() {
      renderDayTabs();
      renderDayContent();
    }

    let timerInterval = null;
    let timerRemaining = 60;
    let timerRunning = false;

    const timerModal = document.getElementById('timerModal');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerToggleBtn = document.getElementById('timerToggleBtn');

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimerDisplay() {
      timerDisplay.innerText = formatTime(timerRemaining);
    }

    function openTimer() {
      timerModal.classList.remove('hidden');
      setTimeout(() => {
        timerModal.classList.remove('opacity-0');
        document.getElementById('timerModalContent').classList.remove('scale-95');
      }, 10);
    }

    function closeTimer() {
      timerModal.classList.add('opacity-0');
      document.getElementById('timerModalContent').classList.add('scale-95');
      setTimeout(() => {
        timerModal.classList.add('hidden');
      }, 250);
    }

    document.getElementById('openTimerBtn').onclick = openTimer;
    document.getElementById('closeTimerBtn').onclick = closeTimer;

    timerToggleBtn.onclick = () => {
      if (timerRunning) {
        // Pause
        clearInterval(timerInterval);
        timerRunning = false;
        timerToggleBtn.innerText = '再開';
        timerToggleBtn.classList.replace('from-stone-700', 'from-champagne-gold');
      } else {
        // Start
        if (timerRemaining <= 0) timerRemaining = 60;
        timerRunning = true;
        timerToggleBtn.innerText = '一時停止';
        timerInterval = setInterval(() => {
          timerRemaining--;
          updateTimerDisplay();
          if (timerRemaining <= 0) {
            clearInterval(timerInterval);
            timerRunning = false;
            timerToggleBtn.innerText = 'スタート';
            if (typeof confetti === 'function') confetti({ particleCount: 40 });
          }
        }, 1000);
      }
    };

    document.getElementById('timerResetBtn').onclick = () => {
      clearInterval(timerInterval);
      timerRunning = false;
      timerRemaining = 60;
      updateTimerDisplay();
      timerToggleBtn.innerText = 'スタート';
    };

    document.querySelectorAll('.timer-preset-btn').forEach(btn => {
      btn.onclick = () => {
        clearInterval(timerInterval);
        timerRunning = false;
        timerRemaining = parseInt(btn.dataset.seconds, 10);
        updateTimerDisplay();
        timerToggleBtn.innerText = 'スタート';
      };
    });

    const resetModal = document.getElementById('resetModal');
    document.getElementById('resetWeekModalBtn').onclick = () => {
      resetModal.classList.remove('hidden');
      setTimeout(() => resetModal.classList.remove('opacity-0'), 10);
    };

    document.getElementById('cancelResetBtn').onclick = () => {
      resetModal.classList.add('opacity-0');
      setTimeout(() => resetModal.classList.add('hidden'), 200);
    };

    document.getElementById('confirmResetBtn').onclick = () => {
      // Clear checks and water, retain notes
      appState.checkedItems = {};
      appState.waterGlasses = {};
      appState.baths = {};
      saveState();
      resetModal.classList.add('opacity-0');
      setTimeout(() => resetModal.classList.add('hidden'), 200);
      renderApp();
    };

    // Jump to Today
    document.getElementById('jumpTodayBtn').onclick = () => {
      appState.activeDay = getTodayKey();
      saveState();
      renderApp();
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderApp();
      updateTimerDisplay();
    });
  </script>
</body>
</html>
